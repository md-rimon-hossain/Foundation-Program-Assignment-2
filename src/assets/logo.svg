<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <!-- Dark background -->
  <rect width="100%" height="100%" fill="#141414" rx="12" />

  <!-- Animated Logo Icon -->
  <g>
    <!-- Outer dashed reel (Native SMIL Rotation) -->
    <circle cx="50" cy="50" r="35" fill="none" stroke="#E50914" stroke-width="6" stroke-dasharray="16 8">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite" />
    </circle>
    
    <!-- Inner dark circle -->
    <circle cx="50" cy="50" r="26" fill="#111111" />
    
    <!-- Center Play Button (Native SMIL Scale and Color Pulse) -->
    <g transform="translate(50, 50)">
      <polygon points="-8,-15 -8,15 15,0" fill="#E50914">
        <!-- Scale animation -->
        <animateTransform attributeName="transform" type="scale" values="1; 1.15; 1" dur="2s" repeatCount="indefinite" />
        <!-- Color change animation -->
        <animate attributeName="fill" values="#E50914; #FFFFFF; #E50914" dur="2s" repeatCount="indefinite" />
      </polygon>
    </g>
  </g>
  
  <!-- Brand Text -->
  <text x="95" y="66" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
    great<tspan fill="#E50914">movies</tspan>
  </text>
</svg>
